sonar.projectKey=DinoSaulo_Quick-WhatsApp-Contact
sonar.organization=dinosaulo

sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=dist/**,node_modules/**,reports/**,coverage/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# CLI scripts with real side effects (network, process.exit) - exempt from the coverage gate only;
# still scanned for bugs/vulnerabilities/smells like every other source file.
sonar.coverage.exclusions=scripts/install-chrome-version.mjs,scripts/install-firefox-version.mjs
