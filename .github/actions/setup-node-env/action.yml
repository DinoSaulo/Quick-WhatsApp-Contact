name: Setup Node.js environment
description: >-
  Configura a versao fixada do Node.js (env.NODE_VERSION) com cache de npm e confirma a versao
  instalada - os dois passos que se repetiam em todo job de ci.yml. NAO inclui o checkout: o job chamador precisa clonar o repositorio antes, ou referenciar esta action local criaria uma dependencia circular.

runs:
  using: composite
  steps:
    - name: Configurar Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    # shell: bash e obrigatorio em passos run: de composite actions (sem shell padrao por SO aqui)
    # - funciona nos 3 SOs via Git Bash nos runners hospedados pelo GitHub, incluindo windows-latest.
    - name: Verificar versao do Node.js
      shell: bash
      run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"
