version: 2

updates:
  # npm devDependencies only (zero runtime deps, enforced by validate-extension.mjs) — keeps them
  # current and lets Dependabot security alerts flag known-vulnerable versions (docs/THREAT_MODEL.md).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"

  # Keeps ci.yml's third-party actions current, including any commit-SHA pins, so supply-chain
  # pinning doesn't mean manually tracking new releases.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
