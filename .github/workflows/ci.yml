name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.2"

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
#  Level 1 ▶ Level 2      ▶ Level 3   ▶ Level 4                              ▶ Level 5   ▶ Level 6
#  Unit     ▶ Integration ▶ Security  ▶ Installation, Chrome AND Firefox     ▶ Validate  ▶ Release
#                                       (OS/distro diversity + N/N-1/N-2
#                                       exact-version pins, per browser)
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Level 1: Unit tests (all platforms) ────────────────────────────────────
  unit-tests:
    name: "1 · Unitarios · ${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependencias do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxe
        run: npm run lint

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes unitarios
        run: >-
          npm run test:unit --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/unit.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-unitarios-${{ matrix.label }}
          path: reports/unit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Gerar build da extensao
        if: matrix.label == 'Ubuntu'
        run: npm run build

      - name: Salvar build como artefato
        if: matrix.label == 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: extension-build
          path: dist/extension/
          retention-days: 1

  # ── Level 2: Integration tests (all platforms) ─────────────────────────────
  integration-tests:
    name: "2 · Integracao · ${{ matrix.label }}"
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependencias do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes de integracao
        run: >-
          npm run test:integration --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/integration.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-integracao-${{ matrix.label }}
          path: reports/integration.xml
          if-no-files-found: warn
          retention-days: 14

  # ── Level 3: Security tests (Linux only) ────────────────────────────────────
  security-tests:
    name: "3 · Seguranca"
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producao
        run: npm audit --omit=dev

      - name: Analise estatica de seguranca (SAST)
        run: npm run lint:sast

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes de seguranca
        run: >-
          npm run test:security --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/security.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-seguranca
          path: reports/security.xml
          if-no-files-found: warn
          retention-days: 14

  # ── Level 4: Installation test (all platforms) ─────────────────────────────
  # Linux entries run in a bare distro container on ubuntu-latest (same technique as the
  # pre-existing Fedora entry): `setup` bootstraps git/curl/nodejs/npm (needed before
  # actions/checkout and actions/setup-node can even run inside a bare container) plus a
  # browser, and `chromeMajor` is the expected installed Chromium major version, asserted by
  # the "Verificar versao do Chromium" step below so a job silently drifting to a different
  # browser version fails loudly instead of quietly testing something else than the label says.
  # Package/version pairs confirmed live via chromiumdash.appspot.com and repology.org.
  installation-test:
    name: "4 · Instalacao · ${{ matrix.label }}"
    needs: security-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Chrome 151 - Ubuntu"
            chromeMajor: "151"
          - os: ubuntu-latest
            label: "Chrome 151 - Fedora"
            container: fedora:latest
            chromeMajor: "151"
            setup: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Debian"
            container: debian:bookworm
            chromeMajor: "151"
            setup: >-
              apt-get update && apt-get install -y --no-install-recommends
              git curl ca-certificates nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Rocky Linux"
            container: rockylinux:9
            chromeMajor: "151"
            setup: >-
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm &&
              dnf install -y --allowerasing --setopt=install_weak_deps=False git curl nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Arch Linux"
            container: archlinux:latest
            chromeMajor: "151"
            setup: pacman -Syu --noconfirm --needed git curl nodejs npm chromium
          - os: macos-latest
            label: "Chrome 150 - macOS"
            chromeMajor: "150"
          - os: windows-latest
            label: "Chrome 151 - Windows"
            chromeMajor: "151"

    steps:
      - name: Preparar sistema (container Linux)
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Verificar Chromium no Fedora
        if: matrix.label == 'Chrome 151 - Fedora'
        run: chromium-browser --version

      # Runs on every platform now (Ubuntu/Fedora/Debian/Rocky/Arch/macOS/Windows), not just the
      # Linux containers — a plain `chromium --version` shell command only reliably works there.
      # scripts/verify-chrome-version.mjs reuses findBrowserExecutable() from
      # tests/installation/browser-environment.mjs (the same lookup the real smoke test uses) so
      # this checks the exact binary puppeteer-core would launch, on every OS, including the
      # Windows-specific PowerShell fallback for a Chrome singleton already running.
      - name: Verificar versao do Chromium
        if: matrix.chromeMajor != ''
        run: node scripts/verify-chrome-version.mjs "${{ matrix.chromeMajor }}"

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Testar instalacao e desinstalacao no Chrome
        run: npm run test:install

  # ── Level 4a: Resolve the 3 most recent Chrome majors (N, N-1, N-2) ────────
  # Feeds installation-test-pinned's matrix below via fromJson, so pinning to "the last 3 major
  # Chrome versions" is computed fresh on every run instead of being 3 numbers someone has to
  # remember to bump by hand (unlike installation-test's chromeMajor labels above, which track
  # whatever each OS/distro package manager ships and are only asserted, not chosen).
  resolve-chrome-versions:
    name: "4a · Resolver versoes do Chrome"
    needs: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Resolver as 3 versoes major mais recentes do Chrome
        id: resolve
        run: node scripts/resolve-chrome-versions.mjs >> "$GITHUB_OUTPUT"

  # ── Level 4b: Installation test pinned to Chrome N / N-1 / N-2 ─────────────
  # Runs the same lifecycle smoke test as installation-test above, but against the 3 exact Chrome
  # majors resolve-chrome-versions just resolved, downloaded straight from Chrome for Testing
  # rather than through any OS package manager. Ubuntu-only: this job's purpose is precise version
  # coverage, not OS/package-manager diversity — installation-test's Fedora/Debian/Rocky/Arch
  # entries already cover that, deliberately, alongside this one.
  installation-test-pinned:
    name: "4b · Instalacao Chrome ${{ matrix.chromeVersion }}"
    needs: [security-tests, resolve-chrome-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chromeVersion: ${{ fromJson(needs.resolve-chrome-versions.outputs.versions) }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      # Confirmed root cause of a real CI crash (SIGSEGV, captured via
      # tests/installation/extension-install.mjs's own Chrome log-file diagnostic): "chrome for
      # Testing" downloaded straight from Google's CDN — as install-chrome-version.mjs does just
      # below, unlike this job's Fedora/Debian/Rocky/Arch siblings which install `chromium`
      # through their own package manager — has no dependency-resolution mechanism of its own.
      # Puppeteer's own troubleshooting docs describe this exact scenario verbatim: "The bundled
      # Chrome for Testing that Puppeteer installs is missing the necessary shared library
      # dependencies." installing google-chrome-stable here is purely for that side effect (pulling
      # in the correct shared libraries via its own .deb dependency chain) — the actual testing
      # still runs against the separately-downloaded, version-pinned binary below via CHROME_PATH,
      # never against this one. Installing the real .deb rather than hand-copying Puppeteer's
      # static package list is deliberate: Ubuntu has renamed several of those packages across
      # releases (e.g. libasound2 → libasound2t64), so letting apt resolve dependencies from the
      # actual current package metadata is more robust than a list that can silently drift out of
      # date. Likely a fast no-op in practice — ubuntu-latest runner images ship Chrome
      # pre-installed already, which is how installation-test's plain "Chrome - Ubuntu" entry (no
      # setup step at all) finds a working browser without this job's crash.
      - name: Instalar Chrome estavel (resolve dependencias de sistema via apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Baixar Chrome for Testing ${{ matrix.chromeVersion }}
        run: |
          EXEC_PATH=$(node scripts/install-chrome-version.mjs "${{ matrix.chromeVersion }}")
          echo "CHROME_PATH=$EXEC_PATH" >> "$GITHUB_ENV"

      - name: Verificar versao do Chrome baixado
        run: node scripts/verify-chrome-version.mjs "$(echo '${{ matrix.chromeVersion }}' | cut -d. -f1)"

      # Every diagnosable cause of a failure here (missing shared libraries, OOM, a test-script
      # regression, CDP transport choice) has already been root-caused and fixed — see git history
      # on tests/installation/extension-install.mjs. What's left is a genuine, rare native SIGSEGV
      # inside this exact pinned Chrome-for-Testing binary that reproduced with healthy memory, all
      # shared libraries resolved, and no command in flight at the moment of the crash (confirmed
      # via that file's own exit-event/ldd/dmesg diagnostics on real failures) — i.e. a real
      # upstream-shaped crash, not something this script's own logic is doing wrong. A small retry
      # loop is the pragmatic answer to that class of failure: proportionate to how rare it is,
      # doesn't mask a systematic bug (there's nothing systematic left to mask, and the crash-dump
      # diagnostics added alongside this still fire and get logged on every attempt, including ones
      # a later retry papers over), and avoids spending a full job re-run's queue time over one
      # flaky attempt in three.
      - name: Testar instalacao e desinstalacao no Chrome
        run: |
          for attempt in 1 2 3; do
            if npm run test:install; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou." >&2
            sleep 5
          done
          exit 1

  # ── Level 4c: Installation test (Firefox, OS/distro diversity) ─────────────
  # Firefox counterpart of installation-test above. Package-manager versions were confirmed live
  # (packages.fedoraproject.org, Debian's own security-announce list, repology.org) for the 4
  # container entries below, which is why only those carry a strict firefoxMajor assertion —
  # Ubuntu/macOS/Windows rely on whatever their GitHub-hosted runner image preinstalls, which
  # isn't practical to pin to an exact number here, so they're left unasserted (the
  # install/uninstall test itself still fails loudly if Firefox is missing or broken there, just
  # not if its version silently drifts). Debian and Rocky ship Firefox's ESR train, which trails
  # the rapid-release major Fedora/Arch carry by many versions — a real, expected split, not a
  # mismatch between entries.
  installation-test-firefox:
    name: "4c · Instalacao Firefox · ${{ matrix.label }}"
    needs: security-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Firefox - Ubuntu"
          - os: ubuntu-latest
            label: "Firefox 153 - Fedora"
            container: fedora:latest
            firefoxMajor: "153"
            setup: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm firefox
          - os: ubuntu-latest
            label: "Firefox 140 (ESR) - Debian"
            container: debian:bookworm
            firefoxMajor: "140"
            setup: >-
              apt-get update && apt-get install -y --no-install-recommends
              git curl ca-certificates nodejs npm firefox-esr
          - os: ubuntu-latest
            label: "Firefox 140 (ESR) - Rocky Linux"
            container: rockylinux:9
            firefoxMajor: "140"
            setup: >-
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm &&
              dnf install -y --allowerasing --setopt=install_weak_deps=False git curl nodejs npm firefox
          - os: ubuntu-latest
            label: "Firefox 153 - Arch Linux"
            container: archlinux:latest
            firefoxMajor: "153"
            setup: pacman -Syu --noconfirm --needed git curl nodejs npm firefox
          - os: macos-latest
            label: "Firefox - macOS"
          - os: windows-latest
            label: "Firefox - Windows"

    steps:
      - name: Preparar sistema (container Linux)
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Verificar versao do Firefox
        if: matrix.firefoxMajor != ''
        run: node scripts/verify-firefox-version.mjs "${{ matrix.firefoxMajor }}"

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Testar instalacao e desinstalacao no Firefox
        run: npm run test:install:firefox

  # ── Level 4d: Resolve the 3 most recent Firefox majors (N, N-1, N-2) ───────
  # Firefox counterpart of resolve-chrome-versions above, against Mozilla's own release-history
  # API instead of Chrome for Testing.
  resolve-firefox-versions:
    name: "4d · Resolver versoes do Firefox"
    needs: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Resolver as 3 versoes major mais recentes do Firefox
        id: resolve
        run: node scripts/resolve-firefox-versions.mjs >> "$GITHUB_OUTPUT"

  # ── Level 4e: Installation test pinned to Firefox N / N-1 / N-2 ────────────
  # Firefox counterpart of installation-test-pinned above: downloads each exact major straight
  # from Mozilla's release archive rather than through any OS package manager. Ubuntu-only, same
  # reasoning as the Chrome pinned job — precise version coverage, not OS diversity.
  installation-test-firefox-pinned:
    name: "4e · Instalacao Firefox ${{ matrix.firefoxVersion }}"
    needs: [security-tests, resolve-firefox-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        firefoxVersion: ${{ fromJson(needs.resolve-firefox-versions.outputs.versions) }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Baixar Firefox ${{ matrix.firefoxVersion }}
        run: |
          EXEC_PATH=$(node scripts/install-firefox-version.mjs "${{ matrix.firefoxVersion }}")
          echo "FIREFOX_PATH=$EXEC_PATH" >> "$GITHUB_ENV"

      - name: Verificar versao do Firefox baixado
        run: node scripts/verify-firefox-version.mjs "$(echo '${{ matrix.firefoxVersion }}' | cut -d. -f1)"

      - name: Testar instalacao e desinstalacao no Firefox
        run: npm run test:install:firefox

  # ── Level 5: Validate extension package ────────────────────────────────────
  validate-extension:
    name: "5 · Validar Extensao"
    needs: [installation-test, installation-test-pinned, installation-test-firefox, installation-test-firefox-pinned]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar pacote Manifest V3
        run: npm run validate:extension

  # ── Level 6: Publish release (main branch only) ────────────────────────────
  release:
    name: "6 · Publicar Release"
    needs: validate-extension
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verificar versao do Node.js
        run: node -e "const actual = process.versions.node; const expected = process.env.NODE_VERSION; if (actual !== expected) { console.error('Expected Node.js ' + expected + ', but found ' + actual); process.exit(1); } console.log('Using Node.js ' + actual);"

      - name: Baixar build da etapa de testes
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Ler versao do manifesto
        id: version
        run: |
          echo "value=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Criar arquivo ZIP
        run: |
          (cd dist/extension && zip -qr "../../dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}.zip" .)

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quick WhatsApp Contact v${{ steps.version.outputs.value }}
          files: dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}.zip
          generate_release_notes: true
          make_latest: true
