name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.2"

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pipeline: Unit -> Integration -> Security -> Installation (Chrome + Firefox, OS/distro diversity
# + N/N-1/N-2 exact-version pins per browser) -> Validate -> Release

jobs:

  # ── Level 1: Unit tests (all platforms) ────────────────────────────────────
  unit-tests:
    name: "1 · Unitarios · ${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependencias do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxe
        run: npm run lint

      - name: Verificar comprimento dos comentarios
        run: npm run lint:comments

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes unitarios
        run: >-
          npm run test:unit --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/unit.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-unitarios-${{ matrix.label }}
          path: reports/unit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Gerar build da extensao
        if: matrix.label == 'Ubuntu'
        run: npm run build

      - name: Salvar build como artefato
        if: matrix.label == 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: extension-build
          path: dist/extension/
          retention-days: 1

  # ── Level 2: Integration tests (all platforms) ─────────────────────────────
  integration-tests:
    name: "2 · Integracao · ${{ matrix.label }}"
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependencias do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes de integracao
        run: >-
          npm run test:integration --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/integration.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-integracao-${{ matrix.label }}
          path: reports/integration.xml
          if-no-files-found: warn
          retention-days: 14

  # ── Level 3: Security tests (Linux only) ────────────────────────────────────
  security-tests:
    name: "3 · Seguranca"
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producao
        run: npm audit --omit=dev

      - name: Analise estatica de seguranca (SAST)
        run: npm run lint:sast

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes de seguranca
        run: >-
          npm run test:security --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/security.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-seguranca
          path: reports/security.xml
          if-no-files-found: warn
          retention-days: 14

  # ── Level 4: Installation test (all platforms). Linux entries run in a bare distro container;
  # `setup` bootstraps git/curl/nodejs/npm first. `chromeMajor` is asserted below so drift fails loudly.
  installation-test:
    name: "4 · Instalacao · ${{ matrix.label }}"
    needs: security-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Chrome 151 - Ubuntu"
            chromeMajor: "151"
          - os: ubuntu-latest
            label: "Chrome 151 - Fedora"
            container: fedora:latest
            chromeMajor: "151"
            setup: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Debian"
            container: debian:bookworm
            chromeMajor: "151"
            setup: >-
              apt-get update && apt-get install -y --no-install-recommends
              git curl ca-certificates nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Rocky Linux"
            container: rockylinux:9
            chromeMajor: "151"
            setup: >-
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm &&
              dnf install -y --allowerasing --setopt=install_weak_deps=False git curl nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Arch Linux"
            container: archlinux:latest
            chromeMajor: "151"
            setup: pacman -Syu --noconfirm --needed git curl nodejs npm chromium
          - os: macos-latest
            label: "Chrome 150 - macOS"
            chromeMajor: "150"
          - os: windows-latest
            label: "Chrome 151 - Windows"
            chromeMajor: "151"

    steps:
      - name: Preparar sistema (container Linux)
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Verificar Chromium no Fedora
        if: matrix.label == 'Chrome 151 - Fedora'
        run: chromium-browser --version

      # Runs on every platform, not just Linux containers (where plain `chromium --version` works).
      # verify-chrome-version.mjs reuses findBrowserExecutable() so this checks the exact binary puppeteer-core would launch.
      - name: Verificar versao do Chromium
        if: matrix.chromeMajor != ''
        run: node scripts/verify-chrome-version.mjs "${{ matrix.chromeMajor }}"

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Testar instalacao e desinstalacao no Chrome
        run: npm run test:install

      # extension-install.mjs writes to ci-diagnostics/ and only deletes it on a genuine pass, so a
      # failed run's evidence is still here to upload. if-no-files-found: ignore is the expected common case, not an error.
      - name: Anexar diagnosticos do Chrome (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnosticos-chrome-${{ matrix.label }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 4a: Resolve the 3 most recent Chrome majors (N, N-1, N-2), computed fresh via fromJson
  # instead of hand-bumped numbers. needs: integration-tests (not security-tests) lets it run alongside security-tests since installation-test-pinned needs its output too.
  resolve-chrome-versions:
    name: "4a · Resolver versoes do Chrome"
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Resolver as 3 versoes major mais recentes do Chrome
        id: resolve
        run: node scripts/resolve-chrome-versions.mjs >> "$GITHUB_OUTPUT"

  # ── Level 4b: Installation test pinned to Chrome N / N-1 / N-2, downloaded straight from Chrome
  # for Testing. Ubuntu-only: this job's purpose is precise version coverage, not OS diversity (installation-test's Fedora/Debian/Rocky/Arch entries cover that).
  installation-test-pinned:
    name: "4b · Instalacao Chrome ${{ matrix.chromeVersion }}"
    needs: [security-tests, resolve-chrome-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chromeVersion: ${{ fromJson(needs.resolve-chrome-versions.outputs.versions) }}
        # TEMPORARY diagnostic entry, remove once answered: every chased SIGSEGV was against
        # 151.0.7922.138; this earlier 151.x patch tells us whether it's a .138-specific regression or the whole 151.x line.
        include:
          - chromeVersion: "151.0.7922.71"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      # Confirmed root cause of a real SIGSEGV: Chrome for Testing (downloaded below) has no
      # dependency-resolution of its own and is missing shared libraries (Puppeteer's own docs describe this exact scenario). Installing google-chrome-stable here is purely for its .deb dependency chain — the actual test still runs against CHROME_PATH below.
      - name: Instalar Chrome estavel (resolve dependencias de sistema via apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Baixar Chrome for Testing ${{ matrix.chromeVersion }}
        run: |
          EXEC_PATH=$(node scripts/install-chrome-version.mjs "${{ matrix.chromeVersion }}")
          echo "CHROME_PATH=$EXEC_PATH" >> "$GITHUB_ENV"

      - name: Verificar versao do Chrome baixado
        run: node scripts/verify-chrome-version.mjs "$(echo '${{ matrix.chromeVersion }}' | cut -d. -f1)"

      # A real CI run SIGSEGV'd all 3 retries identically at nearly the same elapsed time — this
      # step tells "broken binary/runner" apart from "Puppeteer's CDP handling" cheaply: launches the exact binary directly, no Puppeteer, no extension.
      - name: Verificar se o Chrome baixado inicia sem o Puppeteer
        run: |
          "$CHROME_PATH" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom about:blank > /dev/null
          echo "Chrome iniciou e renderizou about:blank sem o Puppeteer."

      # Bisecting further: crashes happened ~15-20s post-launch, right around background.js's
      # onboarding-tab open. --load-extension loads it with no Puppeteer/CDP at all — a crash here points at the extension itself; survival narrows it to Puppeteer's CDP-driven flow.
      - name: Verificar se a extensao carrega sem o Puppeteer
        run: |
          "$CHROME_PATH" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-extensions-except="$(pwd)/dist/extension" \
            --load-extension="$(pwd)/dist/extension" \
            about:blank &
          CHROME_PID=$!
          sleep 20
          if kill -0 "$CHROME_PID" 2>/dev/null; then
            echo "Chrome sobreviveu 20s com a extensao carregada, sem o Puppeteer."
            kill "$CHROME_PID"
            wait "$CHROME_PID" 2>/dev/null || true
          else
            wait "$CHROME_PID"
            EXIT_CODE=$?
            echo "Chrome morreu (exit code $EXIT_CODE) apos carregar a extensao, sem o Puppeteer." >&2
            exit 1
          fi

      # Every diagnosable cause here has been root-caused and fixed; what remains is a native
      # SIGSEGV in this exact pinned binary, confirmed NOT OOM/missing-library/runner (see steps above). Retry loop stays: cheap, and crash-dump diagnostics still fire on every attempt.
      - name: Testar instalacao e desinstalacao no Chrome
        run: |
          for attempt in 1 2 3; do
            if npm run test:install; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou." >&2
            sleep 5
          done
          exit 1

      # if: always(), not if: failure() (unlike non-retrying siblings below) — the retry loop above
      # means an EARLIER failed attempt's diagnostics would otherwise go missing once a LATER attempt succeeds and the step reports success.
      - name: Anexar diagnosticos do Chrome (em caso de falha em qualquer tentativa)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnosticos-chrome-${{ matrix.chromeVersion }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 4c: Installation test (Firefox, OS/distro diversity), counterpart of installation-test.
  # Only the 4 container entries assert firefoxMajor; Ubuntu/macOS/Windows use whatever the runner preinstalls. Debian/Rocky trail on the ESR train by design.
  installation-test-firefox:
    name: "4c · Instalacao Firefox · ${{ matrix.label }}"
    needs: security-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Firefox - Ubuntu"
          - os: ubuntu-latest
            label: "Firefox 153 - Fedora"
            container: fedora:latest
            firefoxMajor: "153"
            setup: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm firefox
          - os: ubuntu-latest
            label: "Firefox 140 (ESR) - Debian"
            container: debian:bookworm
            firefoxMajor: "140"
            setup: >-
              apt-get update && apt-get install -y --no-install-recommends
              git curl ca-certificates nodejs npm firefox-esr
          - os: ubuntu-latest
            label: "Firefox 140 (ESR) - Rocky Linux"
            container: rockylinux:9
            firefoxMajor: "140"
            setup: >-
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm &&
              dnf install -y --allowerasing --setopt=install_weak_deps=False git curl nodejs npm firefox
          - os: ubuntu-latest
            label: "Firefox 153 - Arch Linux"
            container: archlinux:latest
            firefoxMajor: "153"
            setup: pacman -Syu --noconfirm --needed git curl nodejs npm firefox
          - os: macos-latest
            label: "Firefox - macOS"
          - os: windows-latest
            label: "Firefox - Windows"

    steps:
      - name: Preparar sistema (container Linux)
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Verificar versao do Firefox
        if: matrix.firefoxMajor != ''
        run: node scripts/verify-firefox-version.mjs "${{ matrix.firefoxMajor }}"

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Testar instalacao e desinstalacao no Firefox
        run: npm run test:install:firefox

      # firefox-extension-install.mjs writes to ci-diagnostics/ only on its diagnostics-formatting
      # (failure) path, so this is safe as if: failure() even without an explicit delete-on-success.
      - name: Anexar diagnosticos do Firefox (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnosticos-firefox-${{ matrix.label }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 4d: Resolve the 3 most recent Firefox majors (N, N-1, N-2), the Firefox counterpart of
  # resolve-chrome-versions above (Mozilla's release-history API); same needs: integration-tests reasoning.
  resolve-firefox-versions:
    name: "4d · Resolver versoes do Firefox"
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Resolver as 3 versoes major mais recentes do Firefox
        id: resolve
        run: node scripts/resolve-firefox-versions.mjs >> "$GITHUB_OUTPUT"

  # ── Level 4e: Installation test pinned to Firefox N / N-1 / N-2, the Firefox counterpart of
  # installation-test-pinned (downloads each major from Mozilla's archive). Ubuntu-only, same precise-version-coverage reasoning as the Chrome pinned job.
  installation-test-firefox-pinned:
    name: "4e · Instalacao Firefox ${{ matrix.firefoxVersion }}"
    needs: [security-tests, resolve-firefox-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        firefoxVersion: ${{ fromJson(needs.resolve-firefox-versions.outputs.versions) }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Baixar Firefox ${{ matrix.firefoxVersion }}
        run: |
          EXEC_PATH=$(node scripts/install-firefox-version.mjs "${{ matrix.firefoxVersion }}")
          echo "FIREFOX_PATH=$EXEC_PATH" >> "$GITHUB_ENV"

      - name: Verificar versao do Firefox baixado
        run: node scripts/verify-firefox-version.mjs "$(echo '${{ matrix.firefoxVersion }}' | cut -d. -f1)"

      - name: Testar instalacao e desinstalacao no Firefox
        run: npm run test:install:firefox

      # Same reasoning as installation-test-firefox's equivalent step above.
      - name: Anexar diagnosticos do Firefox (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnosticos-firefox-${{ matrix.firefoxVersion }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 5: Validate extension package ────────────────────────────────────
  validate-extension:
    name: "5 · Validar Extensao"
    needs: [installation-test, installation-test-pinned, installation-test-firefox, installation-test-firefox-pinned]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Instalar dependencias
        run: npm ci

      - name: Validar pacote Manifest V3
        run: npm run validate:extension

  # ── Level 6: Publish release (main branch only) ────────────────────────────
  release:
    name: "6 · Publicar Release"
    needs: validate-extension
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Baixar build da etapa de testes
        uses: actions/download-artifact@v7
        with:
          name: extension-build
          path: dist/extension/

      - name: Ler versao do manifesto
        id: version
        run: |
          echo "value=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Criar arquivo ZIP
        run: |
          (cd dist/extension && zip -qr "../../dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}.zip" .)

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quick WhatsApp Contact v${{ steps.version.outputs.value }}
          files: dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}.zip
          generate_release_notes: true
          make_latest: true
