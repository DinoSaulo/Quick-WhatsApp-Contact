name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extra_chrome_version:
        description: "Exact Chrome for Testing version to add to installation-test-pinned's matrix (e.g. 151.0.7922.71), for one-off bisection"
        required: false
        type: string
      extra_firefox_version:
        description: "Exact Firefox version to add to installation-test-firefox-pinned's matrix, for one-off bisection"
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.2"

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pipeline: (Lint + SonarQube, level 0) -> Unit -> (Integration + Security, parallel) ->
# Installation (Chrome + Firefox, OS/distro diversity + N/N-1/N-2 pins per browser) -> Validate -> Release

jobs:

  # ── Level 0: Linting e estilo (sem matriz), agora pre-requisito sequencial de unit-tests —
  # fail-fast: erro de lint barato bloqueia gastar runners com testes antes de passar.
  lint:
    name: "0 · Linting e Estilo"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Sem matrix.label de distro (job so roda em ubuntu-latest); chave usa apenas runner.os.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verificar sintaxe
        run: npm run lint

      - name: Verificar comprimento dos comentários
        run: npm run lint:comments

  # ── Level 0: Analise estatica via SonarQube Cloud (paralelo ao lint, mesmo nivel) — tambem
  # pre-requisito sequencial de unit-tests, junto com lint.
  sonarqube:
    name: "0 · SonarQube"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 (historico completo) e exigido pelo scanner do Sonar para blame/new-code.
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Sem matrix.label de distro (job so roda em ubuntu-latest); chave usa apenas runner.os.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Gera coverage/lcov.info antes do scan — sonar.javascript.lcov.reportPaths (sonar-project.properties)
      # e o que faz o gate new_coverage medir cobertura de verdade em vez de sempre 0%.
      - name: Executar testes com cobertura
        run: npm run test:coverage

      - name: Executar análise do SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Espera o Quality Gate ser calculado no servidor e falha o job (bloqueando unit-tests) se
      # o resultado nao for "passed".
      - name: Verificar Quality Gate do SonarQube
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Level 1: Unit tests (all platforms) ────────────────────────────────────
  unit-tests:
    name: "1 · Unitários · ${{ matrix.label }}"
    needs: [lint, sonarqube]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependências do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Escopada por runner.os + matrix.label para nunca misturar Linux/macOS/Windows nem Fedora
      # com Ubuntu; hit exato pula o npm ci por completo.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ matrix.label }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ matrix.label }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Preparar diretório de relatórios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes unitários
        run: >-
          npm run test:unit --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/unit.xml

      - name: Anexar relatório JUnit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relatorio-unitarios-${{ matrix.label }}
          path: reports/unit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Gerar build da extensão (Chrome)
        if: matrix.label == 'Ubuntu'
        run: npm run build

      - name: Salvar build como artefato (Chrome)
        if: matrix.label == 'Ubuntu'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: extension-build
          path: dist/extension/
          retention-days: 1

      # build-extension.mjs limpa dist/ a cada chamada, entao o upload do Chrome acima
      # precisa terminar antes desta segunda build sobrescrever dist/extension/.
      - name: Gerar build da extensão (Firefox)
        if: matrix.label == 'Ubuntu'
        run: npm run build:firefox

      - name: Salvar build como artefato (Firefox)
        if: matrix.label == 'Ubuntu'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: extension-build-firefox
          path: dist/extension/
          retention-days: 1

      # build-extension.mjs limpa dist/ a cada chamada, entao o upload do Firefox acima
      # precisa terminar antes desta terceira build sobrescrever dist/extension/.
      - name: Gerar build da extensão (Opera)
        if: matrix.label == 'Ubuntu'
        run: npm run build:opera

      - name: Salvar build como artefato (Opera)
        if: matrix.label == 'Ubuntu'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: extension-build-opera
          path: dist/extension/
          retention-days: 1

  # ── Level 2: Integration tests (all platforms) ─────────────────────────────
  integration-tests:
    name: "2 · Integração · ${{ matrix.label }}"
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependências do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Mesma logica de cache de node_modules do job 1 (Unitarios) acima.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ matrix.label }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ matrix.label }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Preparar diretório de relatórios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes de integração
        run: >-
          npm run test:integration --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/integration.xml

      - name: Anexar relatório JUnit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relatorio-integracao-${{ matrix.label }}
          path: reports/integration.xml
          if-no-files-found: warn
          retention-days: 14

  # ── Level 3: Security tests (Linux only) ────────────────────────────────────
  security-tests:
    name: "3 · segurança"
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Sem matrix.label (job roda so em ubuntu-latest, sem distro variavel) — chave usa apenas
      # runner.os.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev

      - name: Analise estatica de segurança (SAST)
        run: npm run lint:sast

      - name: Preparar diretório de relatórios
        shell: bash
        run: mkdir -p reports

      # Builds, then runs the security suite plus the AMO validator (web-ext lint) in one
      # execution — tests/webExtLint.test.js is a vitest file, so it needs no separate step.
      - name: Executar testes de segurança (incl. validador da AMO)
        run: >-
          npm run test:security --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/security.xml

      - name: Anexar relatório JUnit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relatorio-seguranca
          path: reports/security.xml
          if-no-files-found: warn
          retention-days: 14

  # ── Level 4: Installation test (all platforms). Linux entries run in a bare distro container;
  # `setup` bootstraps git/curl/nodejs/npm first. `chromeMajor` is asserted below so drift fails loudly.
  installation-test-chrome:
    name: "4 · Instalação · ${{ matrix.label }}"
    needs: [integration-tests, security-tests]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Chrome 151 - Ubuntu"
            chromeMajor: "151"
          - os: ubuntu-latest
            label: "Chrome 151 - Fedora"
            container: fedora:latest
            chromeMajor: "151"
            setup: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Debian"
            container: debian:bookworm
            chromeMajor: "151"
            setup: >-
              apt-get update && apt-get install -y --no-install-recommends
              git curl ca-certificates nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Rocky Linux"
            container: rockylinux:9
            chromeMajor: "151"
            setup: >-
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm &&
              dnf install -y --allowerasing --setopt=install_weak_deps=False git curl nodejs npm chromium
          - os: ubuntu-latest
            label: "Chrome 151 - Arch Linux"
            container: archlinux:latest
            chromeMajor: "151"
            setup: pacman -Syu --noconfirm --needed git curl nodejs npm chromium
          - os: macos-latest
            label: "Chrome 150 - macOS"
            chromeMajor: "150"
          - os: windows-latest
            label: "Chrome 151 - Windows"
            chromeMajor: "151"

    steps:
      - name: Preparar sistema (container Linux)
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Verificar Chromium no Fedora
        if: matrix.label == 'Chrome 151 - Fedora'
        run: chromium-browser --version

      # Runs on every platform, not just Linux containers (where plain `chromium --version` works).
      # verify-chrome-version.mjs reuses findBrowserExecutable() so this checks the exact binary puppeteer-core would launch.
      - name: Verificar versão do Chromium
        if: matrix.chromeMajor != ''
        run: node scripts/verify-chrome-version.mjs "${{ matrix.chromeMajor }}"

      # Escopada por runner.os + matrix.label (cada distro/SO tem chave propria); hit exato pula
      # o npm ci por completo, em todas as pernas do job (nao so Fedora/Rocky Linux).
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ matrix.label }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ matrix.label }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: dist/extension/

      # Mesmo padrão de retry do nível 4b, diagnósticos preservados abaixo. shell: bash
      # explícito: job roda em windows-latest, cujo run: padrão é pwsh (não bash).
      - name: Testar instalação e desinstalação no Chrome
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run test:install; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou." >&2
            sleep 5
          done
          exit 1

      # if: always(), não if: failure() (igual ao 4b) — com o retry acima, uma tentativa anterior
      # que falhou perderia seus diagnósticos assim que uma tentativa posterior tiver sucesso.
      - name: Anexar diagnósticos do Chrome (em caso de falha em qualquer tentativa)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnosticos-chrome-${{ matrix.label }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 4a: Resolve the 3 most recent Chrome majors (N, N-1, N-2), computed fresh via fromJson
  # instead of hand-bumped numbers. needs: [integration-tests, security-tests] now (uniform Level 4 convention) — this job no longer runs in parallel with security-tests, even though installation-test-pinned's own needs already guaranteed waiting for it.
  resolve-chrome-versions:
    name: "4a · Resolver versões do Chrome"
    needs: [integration-tests, security-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # EXTRA_CHROME_VERSION via env (nao ${{ inputs.* }} direto no run:) - input de
      # workflow_dispatch e controlado por quem dispara, interpolar sem env: seria script injection.
      - name: Resolver as 3 versões major mais recentes do Chrome
        id: resolve
        env:
          EXTRA_CHROME_VERSION: ${{ inputs.extra_chrome_version }}
        run: >-
          node scripts/resolve-chrome-versions.mjs "$EXTRA_CHROME_VERSION"
          >> "$GITHUB_OUTPUT"

  # ── Level 4b: Installation test pinned to Chrome N / N-1 / N-2, downloaded straight from Chrome
  # for Testing. Ubuntu-only: this job's purpose is precise version coverage, not OS diversity (installation-test's Fedora/Debian/Rocky/Arch entries cover that).
  installation-test-pinned:
    name: "4b · Instalação Chrome ${{ matrix.chromeVersion }}"
    needs: [security-tests, resolve-chrome-versions, installation-test-chrome]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # extra_chrome_version (workflow_dispatch input) folds into this array in
      # resolve-chrome-versions.mjs itself, instead of a separate, easy-to-forget matrix entry.
      matrix:
        chromeVersion: ${{ fromJson(needs.resolve-chrome-versions.outputs.versions) }}

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Sem matrix.label de distro (job so roda em ubuntu-latest); chave usa apenas runner.os.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: dist/extension/

      # Confirmed root cause of a real SIGSEGV: Chrome for Testing (downloaded below) has no
      # dependency-resolution of its own and is missing shared libraries (Puppeteer's own docs describe this exact scenario). Installing google-chrome-stable here is purely for its .deb dependency chain — the actual test still runs against CHROME_PATH below.
      - name: Instalar Chrome estável (resolve dependências de sistema via apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # Keyed by the exact pinned version, never by a floating label — a version's binary never
      # changes once published, so a cache hit is always safe to reuse as-is.
      - name: Cache do Chrome for Testing ${{ matrix.chromeVersion }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .chrome-for-testing/${{ matrix.chromeVersion }}
          key: chrome-for-testing-${{ matrix.chromeVersion }}

      - name: Baixar Chrome for Testing ${{ matrix.chromeVersion }}
        run: |
          EXEC_PATH=$(node scripts/install-chrome-version.mjs "${{ matrix.chromeVersion }}")
          echo "CHROME_PATH=$EXEC_PATH" >> "$GITHUB_ENV"

      - name: Verificar versão do Chrome baixado
        run: node scripts/verify-chrome-version.mjs "$(echo '${{ matrix.chromeVersion }}' | cut -d. -f1)"

      # A real CI run SIGSEGV'd all 3 retries identically at nearly the same elapsed time — this
      # step tells "broken binary/runner" apart from "Puppeteer's CDP handling" cheaply: launches the exact binary directly, no Puppeteer, no extension.
      - name: Verificar se o Chrome baixado inicia sem o Puppeteer
        run: |
          "$CHROME_PATH" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom about:blank > /dev/null
          echo "Chrome iniciou e renderizou about:blank sem o Puppeteer."

      # Bisecting further: crashes happened ~15-20s post-launch, right around background.js's
      # onboarding-tab open. --load-extension loads it with no Puppeteer/CDP at all — a crash here points at the extension itself; survival narrows it to Puppeteer's CDP-driven flow.
      - name: Verificar se a extensão carrega sem o Puppeteer
        run: |
          "$CHROME_PATH" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-extensions-except="$(pwd)/dist/extension" \
            --load-extension="$(pwd)/dist/extension" \
            about:blank &
          CHROME_PID=$!
          sleep 20
          if kill -0 "$CHROME_PID" 2>/dev/null; then
            echo "Chrome sobreviveu 20s com a extensão carregada, sem o Puppeteer."
            kill "$CHROME_PID"
            wait "$CHROME_PID" 2>/dev/null || true
          else
            wait "$CHROME_PID"
            EXIT_CODE=$?
            echo "Chrome morreu (exit code $EXIT_CODE) apos carregar a extensão, sem o Puppeteer." >&2
            exit 1
          fi

      # Every diagnosable cause here has been root-caused and fixed; what remains is a native
      # SIGSEGV in this exact pinned binary, confirmed NOT OOM/missing-library/runner (see steps above). Retry loop stays: cheap, and crash-dump diagnostics still fire on every attempt.
      - name: Testar instalação e desinstalação no Chrome
        run: |
          for attempt in 1 2 3; do
            if npm run test:install; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou." >&2
            sleep 5
          done
          exit 1

      # if: always(), not if: failure() (unlike non-retrying siblings below) — the retry loop above
      # means an EARLIER failed attempt's diagnostics would otherwise go missing once a LATER attempt succeeds and the step reports success.
      - name: Anexar diagnósticos do Chrome (em caso de falha em qualquer tentativa)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnosticos-chrome-${{ matrix.chromeVersion }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 4c: Installation test (Firefox, OS/distro diversity), counterpart of installation-test.
  # Only the 4 container entries assert firefoxMajor; Ubuntu/macOS/Windows use whatever the runner preinstalls. Debian/Rocky trail on the ESR train by design.
  installation-test-firefox:
    name: "4c · Instalação Firefox · ${{ matrix.label }}"
    needs: [integration-tests, security-tests]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Firefox - Ubuntu"
          - os: ubuntu-latest
            label: "Firefox 154 - Fedora"
            container: fedora:latest
            firefoxMajor: "154"
            setup: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm firefox
          - os: ubuntu-latest
            label: "Firefox 140 (ESR) - Debian"
            container: debian:bookworm
            firefoxMajor: "140"
            setup: >-
              apt-get update && apt-get install -y --no-install-recommends
              git curl ca-certificates nodejs npm firefox-esr
          - os: ubuntu-latest
            label: "Firefox 140 (ESR) - Rocky Linux"
            container: rockylinux:9
            firefoxMajor: "140"
            setup: >-
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm &&
              dnf install -y --allowerasing --setopt=install_weak_deps=False git curl nodejs npm firefox
          - os: ubuntu-latest
            label: "Firefox 154 - Arch Linux"
            container: archlinux:latest
            firefoxMajor: "154"
            setup: pacman -Syu --noconfirm --needed git curl nodejs npm firefox
          - os: macos-latest
            label: "Firefox - macOS"
          - os: windows-latest
            label: "Firefox - Windows"

    steps:
      - name: Preparar sistema (container Linux)
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Verificar versão do Firefox
        if: matrix.firefoxMajor != ''
        run: node scripts/verify-firefox-version.mjs "${{ matrix.firefoxMajor }}"

      # Mesma logica de cache de node_modules de installation-test acima, agora em todas as
      # pernas do job (runner.os + matrix.label), nao so Fedora/Rocky Linux.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ matrix.label }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ matrix.label }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: dist/extension/

      # Mesmo padrão de retry do nível 4b, diagnósticos preservados abaixo. shell: bash
      # explícito: job roda em windows-latest ("Firefox - Windows"), cujo run: padrão é pwsh.
      - name: Testar instalação e desinstalação no Firefox
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run test:install:firefox; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou." >&2
            sleep 5
          done
          exit 1

      # if: always() — com o retry acima, uma tentativa anterior que falhou (e escreveu
      # diagnósticos) não pode perder essa evidência quando uma tentativa posterior tiver sucesso.
      - name: Anexar diagnósticos do Firefox (em caso de falha em qualquer tentativa)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnosticos-firefox-${{ matrix.label }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 4d: Resolve the 3 most recent Firefox majors (N, N-1, N-2), the Firefox counterpart of
  # resolve-chrome-versions above (Mozilla's release-history API); same needs: [integration-tests, security-tests] reasoning as that job's comment.
  resolve-firefox-versions:
    name: "4d · Resolver versões do Firefox"
    needs: [integration-tests, security-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # EXTRA_FIREFOX_VERSION via env (mesma razão do job resolve-chrome-versions acima: input
      # de workflow_dispatch interpolado direto no run: seria script injection).
      - name: Resolver as 3 versões major mais recentes do Firefox
        id: resolve
        env:
          EXTRA_FIREFOX_VERSION: ${{ inputs.extra_firefox_version }}
        run: >-
          node scripts/resolve-firefox-versions.mjs "$EXTRA_FIREFOX_VERSION"
          >> "$GITHUB_OUTPUT"

  # ── Level 4e: Installation test pinned to Firefox N / N-1 / N-2, the Firefox counterpart of
  # installation-test-pinned (downloads each major from Mozilla's archive). Ubuntu-only, same precise-version-coverage reasoning as the Chrome pinned job.
  installation-test-firefox-pinned:
    name: "4e · Instalação Firefox ${{ matrix.firefoxVersion }}"
    needs: [security-tests, resolve-firefox-versions, installation-test-firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # extra_firefox_version (workflow_dispatch input) folds into this array the same way as
      # installation-test-pinned's Chrome equivalent above.
      matrix:
        firefoxVersion: ${{ fromJson(needs.resolve-firefox-versions.outputs.versions) }}

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Sem matrix.label de distro (job so roda em ubuntu-latest); chave usa apenas runner.os.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: dist/extension/

      # Same reasoning as installation-test-pinned's equivalent Chrome cache step above.
      - name: Cache do Firefox ${{ matrix.firefoxVersion }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .firefox-releases/${{ matrix.firefoxVersion }}
          key: firefox-releases-${{ matrix.firefoxVersion }}

      - name: Baixar Firefox ${{ matrix.firefoxVersion }}
        run: |
          EXEC_PATH=$(node scripts/install-firefox-version.mjs "${{ matrix.firefoxVersion }}")
          echo "FIREFOX_PATH=$EXEC_PATH" >> "$GITHUB_ENV"

      - name: Verificar versão do Firefox baixado
        run: node scripts/verify-firefox-version.mjs "$(echo '${{ matrix.firefoxVersion }}' | cut -d. -f1)"

      # Mesmo padrão de retry do nível 4b (installation-test-pinned): 3 tentativas antes de
      # falhar o job de fato, com diagnósticos de qualquer tentativa preservados abaixo.
      - name: Testar instalação e desinstalação no Firefox
        run: |
          for attempt in 1 2 3; do
            if npm run test:install:firefox; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou." >&2
            sleep 5
          done
          exit 1

      # if: always() — mesma razão do equivalente installation-test-firefox acima, agora que este
      # step também tem retry.
      - name: Anexar diagnósticos do Firefox (em caso de falha em qualquer tentativa)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnosticos-firefox-${{ matrix.firefoxVersion }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # Level 4f: Safari (macOS-only), two disconnected smoke tests: xcrun+xcodebuild still convert
  # and compile the real extension; the later WebKit step is Playwright's generic engine only.
  installation-test-safari:
    name: "4f · Instalação Safari"
    needs: security-tests
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Sem matrix.label de distro (job so roda em macos-latest); chave usa apenas runner.os.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: dist/extension/

      - name: Verificar ferramentas do Xcode
        run: |
          xcrun --version
          xcodebuild -version

      - name: Converter e compilar a Safari Web Extension
        run: |
          APP_PATH=$(node scripts/convert-safari-extension.mjs)
          echo "SAFARI_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # Excecao deliberada ao "build so no nivel 1": o projeto Xcode so pode ser gerado numa
      # maquina com Xcode (macOS), que so existe aqui no nivel 4f.
      - name: Salvar projeto Xcode como artefato (Safari)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: extension-build-safari
          path: |
            .safari-build
            !.safari-build/DerivedData
          retention-days: 1

      # Chave nova e isolada (nao reutiliza chrome-for-testing-*/firefox-releases-*); npx playwright
      # install ja e idempotente/rapido num cache-hit, sem precisar de skip condicional aqui.
      - name: Cache do WebKit do Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .playwright-browsers
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar o WebKit do Playwright
        run: npx playwright install webkit

      # continue-on-error apenas aqui: falhas de build/conversao acima ainda derrubam o job.
      # Este passo nao abre o .app convertido nem o Safari real — ver cabecalho do script chamado.
      - name: Smoke test do motor WebKit via Playwright (nao e o Safari real)
        id: safari-install-test
        continue-on-error: true
        # Mesmo retry de 3 tentativas dos demais níveis 4; continue-on-error acima trata o outcome final como best-effort.
        run: |
          for attempt in 1 2 3; do
            if npm run test:install:safari; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou." >&2
            sleep 5
          done
          exit 1

      - name: Avisar sobre resultado best-effort do WebKit
        if: steps.safari-install-test.outcome == 'failure'
        run: echo "::warning::Nivel 4f (WebKit/Playwright) nao passou (best-effort) — ver diagnosticos-safari."

      # failure() alone misses the WebKit step's continue-on-error case (its conclusion reads
      # "success" even on a real failure); the explicit outcome check below covers that gap.
      - name: Anexar diagnósticos do Safari (em caso de falha)
        if: failure() || steps.safari-install-test.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnosticos-safari
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── Level 5: Validate extension package ────────────────────────────────────
  validate-extension:
    name: "5 · Validar Extensão"
    needs: [installation-test-chrome, installation-test-pinned, installation-test-firefox, installation-test-firefox-pinned, installation-test-safari]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      # Sem matrix.label de distro (job so roda em ubuntu-latest); chave usa apenas runner.os.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validar pacote Manifest V3
        run: npm run validate:extension

  # ── Level 6: Publish release (main branch only) ────────────────────────────
  release:
    name: "6 · Publicar Release"
    needs: validate-extension
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Clonar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar ambiente Node.js
        uses: ./.github/actions/setup-node-env

      - name: Baixar build da etapa de testes (Chrome)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: dist/extension-chrome/

      - name: Baixar build da etapa de testes (Firefox)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build-firefox
          path: dist/extension-firefox/

      - name: Baixar build da etapa de testes (Opera)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build-opera
          path: dist/extension-opera/

      - name: Baixar build da etapa de testes (Safari)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build-safari
          path: dist/extension-safari/

      - name: Ler versão do manifesto
        id: version
        run: |
          echo "value=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Criar arquivos ZIP
        run: |
          (cd dist/extension-chrome && zip -qr "../../dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-chrome.zip" .)
          (cd dist/extension-firefox && zip -qr "../../dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-firefox.zip" .)
          (cd dist/extension-opera && zip -qr "../../dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-opera.zip" .)
          (cd dist/extension-safari && zip -qr "../../dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-safari.zip" .)

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quick WhatsApp Contact v${{ steps.version.outputs.value }}
          files: |
            dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-chrome.zip
            dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-firefox.zip
            dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-opera.zip
            dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}-safari.zip
          generate_release_notes: true
          make_latest: true
