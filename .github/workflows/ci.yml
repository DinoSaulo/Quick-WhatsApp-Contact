name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
#  Level 1 ▶ Level 2      ▶ Level 3       ▶ Level 4   ▶ Level 5
#  Unit     ▶ Integration ▶ Installation  ▶ Validate  ▶ Release
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Level 1: Unit tests (all platforms) ────────────────────────────────────
  unit-tests:
    name: "1 · Unitarios · ${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependencias do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxe
        run: npm run lint

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes unitarios
        run: >-
          npm run test:unit --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/unit.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-unitarios-${{ matrix.label }}
          path: reports/unit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Gerar build da extensao
        if: matrix.label == 'Ubuntu'
        run: npm run build

      - name: Salvar build como artefato
        if: matrix.label == 'Ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: dist/extension/
          retention-days: 1

  # ── Level 2: Integration tests (all platforms) ─────────────────────────────
  integration-tests:
    name: "2 · Integracao · ${{ matrix.label }}"
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependencias do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar diretorio de relatorios
        shell: bash
        run: mkdir -p reports

      - name: Executar testes de integracao
        run: >-
          npm run test:integration --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=reports/integration.xml

      - name: Anexar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-integracao-${{ matrix.label }}
          path: reports/integration.xml
          if-no-files-found: warn
          retention-days: 14

  # ── Level 3: Installation test (all platforms) ─────────────────────────────
  installation-test:
    name: "3 · Instalacao no Chrome · ${{ matrix.label }}"
    needs: integration-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: ubuntu-latest
            label: Fedora
            container: fedora:latest
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - name: Instalar dependencias do sistema (Fedora)
        if: matrix.label == 'Fedora'
        run: dnf install -y --setopt=install_weak_deps=False git curl nodejs npm

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Baixar build da etapa anterior
        uses: actions/download-artifact@v4
        with:
          name: extension-build
          path: dist/extension/

      - name: Testar instalacao e desinstalacao no Chrome
        run: npm run test:install

  # ── Level 4: Validate extension package ────────────────────────────────────
  validate-extension:
    name: "4 · Validar Extensao"
    needs: installation-test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar pacote Manifest V3
        run: npm run validate:extension

  # ── Level 5: Publish release (main branch only) ────────────────────────────
  release:
    name: "5 · Publicar Release"
    needs: validate-extension
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar build da etapa de testes
        uses: actions/download-artifact@v4
        with:
          name: extension-build
          path: dist/extension/

      - name: Ler versao do manifesto
        id: version
        run: |
          echo "value=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Criar arquivo ZIP
        run: |
          (cd dist/extension && zip -qr "../../dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}.zip" .)

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quick WhatsApp Contact v${{ steps.version.outputs.value }}
          files: dist/quick-whatsapp-contact-v${{ steps.version.outputs.value }}.zip
          generate_release_notes: true
          make_latest: true
